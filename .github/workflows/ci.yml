name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      # Runs after the build so a compile failure is reported first; docs drift is real
      # but never the more urgent signal.
      - name: Check docs consistency
        run: ./scripts/check-docs.sh
